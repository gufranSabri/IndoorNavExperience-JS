<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>Indoor Wayfinding — Satellite</title>
  <style>
    :root {
      --sat-font: Inter, ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --sat-glass: rgba(21, 23, 28, 0.8);
      --sat-border: rgba(255, 255, 255, 0.09);
      --sat-text: #eef1f5;
      --sat-muted: #98a2b3;
    }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100dvh;
      background: #0b0c0f;
      font-family: var(--sat-font);
      overscroll-behavior: none;
      overflow: hidden;
      /* Phones double-tap-zoom or select text on stray taps otherwise —
         this page is an app shell, not a document. */
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #map { position: absolute; inset: 0; }

    .panel {
      position: absolute; z-index: 5;
      top: calc(16px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left));
      width: min(380px, calc(100vw - 32px)); padding: 16px 16px 16px;
      border-radius: 20px; color: var(--sat-text);
      background: var(--sat-glass); border: 1px solid var(--sat-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    .brand { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 14px; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    .floor-switch { display: flex; gap: 4px; padding: 3px; margin: 0 0 14px; border-radius: 12px; background: rgba(255,255,255,.06); }
    .floor-switch button {
      appearance: none; flex: 1; height: 32px; border: 0; border-radius: 9px; background: transparent; color: var(--sat-muted);
      font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; transition: background .15s ease, color .15s ease;
    }
    .floor-switch button:hover { color: var(--sat-text); }
    .floor-switch button.is-active { background: rgba(255,255,255,.14); color: var(--sat-text); }
    .brand span { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sat-muted); }

    /* Desktop-only "open on your phone" card. On phones (<= 560px, where the
       selector becomes a full-width bar) there is nothing to scan, so it's hidden. */
    .qr-card {
      position: absolute; z-index: 5; display: none;
      top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
      width: 148px; padding: 12px; box-sizing: border-box; border-radius: 20px; text-align: center;
      color: var(--sat-text); background: var(--sat-glass); border: 1px solid var(--sat-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 561px) { .qr-card { display: block; } }
    .qr-card svg { display: block; width: 100%; height: auto; border-radius: 10px; }
    .qr-card p { margin: 10px 0 0; font-size: 11px; line-height: 1.35; color: var(--sat-muted); }

    .player-wrap {
      position: absolute; z-index: 5; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none;
      bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .player-wrap > * { pointer-events: auto; }

    .hint {
      position: absolute; z-index: 4; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--sat-muted); white-space: nowrap;
      background: var(--sat-glass); border: 1px solid var(--sat-border); pointer-events: none;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: opacity 0.6s ease 0.4s;
    }
    .hint.is-hidden { opacity: 0; }
    @media (max-width: 560px), (pointer: coarse) { .hint { display: none; } }
    @media (max-width: 560px) {
      /* On a phone the selector is a full-width bar across the top of the screen. */
      .panel {
        top: 0; left: 0; right: 0; width: auto; box-sizing: border-box;
        padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));
        border-width: 0 0 1px 0; border-radius: 0 0 20px 20px;
      }
      .player-wrap { bottom: calc(14px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <div class="brand"><h1 id="floor-title">Floor 1</h1><span>Indoor map</span></div>
    <div class="floor-switch" id="floor-switch" role="tablist" aria-label="Floor"></div>
    <div id="selector"></div>
  </div>

  <div class="qr-card" id="qr-card">
    <div id="qr"></div>
    <p>Scan to open on your phone</p>
  </div>

  <div class="player-wrap"><div id="player"></div></div>
  <div class="hint" id="hint">Drag to pan · scroll to zoom · right-drag to rotate &amp; tilt · zoom in for labels</div>

  <!--
    Plain native ES modules from src/ — no bundler, no npm, no CDN. Three.js is
    vendored at src/vendor/three.module.js and imported by relative path.
  -->
  <script type="module">
    import { SatelliteView, RouteSelector, RouteControls } from './3D_satellite/src/index.js';
    import qrcodegen from './3D_satellite/src/vendor/qrcodegen.js';

    // Everything talks through DOM events on this one element.
    const mapEl = document.getElementById('map');
    const panel = document.querySelector('.panel');
    const player = document.getElementById('player');
    // Keep the floating UI out of the way when framing the building / a route.
    const getInsets = () => {
      const p = panel.getBoundingClientRect();
      const playerH = player.firstElementChild?.classList.contains('is-visible') ? 96 : 0;
      if (mapEl.clientWidth > 900) return { left: p.right + 8, right: 70, bottom: playerH };
      return { top: p.bottom + 4, bottom: Math.max(playerH, 12), right: 60 };
    };
    // QR code of this page's URL. If you're browsing via localhost, a phone can't reach it —
    // set PHONE_URL to an address it can (LAN IP or deployed URL), e.g. 'http://192.168.1.20:8000/'. When hosted online, leave it null: the QR then encodes the site's own address.
    const PHONE_URL = null;
    const qr = qrcodegen.QrCode.encodeText(PHONE_URL || location.origin + location.pathname, qrcodegen.QrCode.Ecc.MEDIUM);
    const border = 2; // quiet zone, in modules
    let d = '';
    for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.getModule(x, y)) d += `M${x + border},${y + border}h1v1h-1z`;
    const dim = qr.size + border * 2;
    document.getElementById('qr').innerHTML =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges" role="img" aria-label="QR code to open this page on a phone"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

    const view = new SatelliteView(mapEl, { eventTarget: mapEl, getInsets });

    // The kiosk nearest a "main exit" (view.defaultStartNodeId) is where the blue
    // "you are here" dot starts, and the pre-selected start of any route.
    new RouteSelector(document.getElementById('selector'), { eventTarget: mapEl });
    new RouteControls(document.getElementById('player'), { eventTarget: mapEl });
    // The card grows/shrinks when a route is set or cleared; keep the map framed around it.
    mapEl.addEventListener('wayfinding:route-cleared', () => view.refreshInsets());
    window.addEventListener('resize', () => view.refreshInsets());

    // The two sample floors (see docs/MAP_DATA_STORAGE.md for the on-disk layout this mirrors).
    const FLOORS = [
      { name: 'Floor 1', url: './3D_satellite/example/data/floors/2/0/' },
      { name: 'Floor 2', url: './3D_satellite/example/data/floors/2/1/' },
    ];
    const switchEl = document.getElementById('floor-switch');
    const titleEl = document.getElementById('floor-title');
    let loadToken = 0;
    async function showFloor(index) {
      const token = ++loadToken; // a slow earlier load must not overwrite a newer pick
      [...switchEl.children].forEach((b, i) => b.classList.toggle('is-active', i === index));
      titleEl.textContent = FLOORS[index].name;
      try {
        await view.loadFloor(FLOORS[index].url);
        if (token !== loadToken) return;
        if (view.defaultStartNodeId) view.setUserNode(view.defaultStartNodeId);
        view.refreshInsets();
      } catch (err) {
        console.error(err);
        mapEl.insertAdjacentHTML('beforeend', `<p style="position:absolute;color:#fff;padding:20px">Failed to load floor data: ${err.message}</p>`);
      }
    }
    FLOORS.forEach((floor, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = floor.name;
      btn.addEventListener('click', () => showFloor(i));
      switchEl.appendChild(btn);
    });
    showFloor(0);

    const hint = document.getElementById('hint');
    const hideHint = () => hint.classList.add('is-hidden');
    mapEl.addEventListener('pointerdown', hideHint, { once: true });
    mapEl.addEventListener('wheel', hideHint, { once: true, passive: true });

    window.view = view; // handy for poking around in the console
  </script>
</body>
</html>
