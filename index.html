<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>Indoor Wayfinding — Satellite</title>
  <style>
    :root {
      --sat-font: Inter, ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --sat-glass: rgba(21, 23, 28, 0.8);
      --sat-border: rgba(255, 255, 255, 0.09);
      --sat-text: #eef1f5;
      --sat-muted: #98a2b3;
    }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100dvh;
      background: #0b0c0f;
      font-family: var(--sat-font);
      overscroll-behavior: none;
      overflow: hidden;
      /* Phones double-tap-zoom or select text on stray taps otherwise —
         this page is an app shell, not a document. */
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #map { position: absolute; inset: 0; }

    /* Desktop-only "open on your phone" card. On phones there's no room for
       it beside the bottom trip-progress card, so it's hidden there. */
    .qr-card {
      position: absolute; z-index: 5; display: none;
      top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
      width: 148px; padding: 12px; box-sizing: border-box; border-radius: 20px; text-align: center;
      color: var(--sat-text); background: var(--sat-glass); border: 1px solid var(--sat-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 561px) { .qr-card { display: block; } }
    .qr-card svg { display: block; width: 100%; height: auto; border-radius: 10px; }
    .qr-card p { margin: 10px 0 0; font-size: 11px; line-height: 1.35; color: var(--sat-muted); }

    /* Building picker - the root "/" view, shown instead of the map/panel
       until a building is chosen (see ?building= handling below). The
       [hidden] rule must come first/win over .picker-wrap's own `display`
       (an author-stylesheet class rule otherwise always beats the
       UA stylesheet's default `[hidden] { display: none }`, attribute or
       not) - without it this overlay stays visible and blocks the map on
       every page, building selected or not. */
    .picker-wrap[hidden] { display: none; }
    .picker-wrap {
      position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: #0b0c0f;
    }
    .picker-card {
      width: min(420px, calc(100vw - 48px)); max-height: calc(100vh - 96px); overflow: auto;
      padding: 20px; border-radius: 20px; color: var(--sat-text);
      background: var(--sat-glass); border: 1px solid var(--sat-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    .picker-card h1 { margin: 2px 2px 16px; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
    .picker-list { display: flex; flex-direction: column; gap: 8px; }
    .picker-list button {
      appearance: none; display: block; width: 100%; text-align: left; box-sizing: border-box;
      padding: 14px 16px; border: 1px solid var(--sat-border); border-radius: 14px;
      background: rgba(255,255,255,.04); color: var(--sat-text);
      font: 600 14px/1.3 inherit; font-family: inherit; cursor: pointer; transition: background .15s ease;
    }
    .picker-list button:hover { background: rgba(255,255,255,.1); }
    .picker-empty, .picker-error { margin: 2px; font-size: 13px; color: var(--sat-muted); }
  </style>
</head>
<body>
  <div class="picker-wrap" id="picker-wrap" hidden>
    <div class="picker-card">
      <h1>Select a building</h1>
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="disclaimer-root"></div>
  <div id="trip-planner-root"></div>
  <div id="itinerary-root"></div>
  <div id="trip-progress-root"></div>

  <div class="qr-card" id="qr-card">
    <div id="qr"></div>
    <p>Scan to open on your phone</p>
  </div>

  <!--
    Plain native ES modules from src/ — no bundler, no npm, no CDN. Three.js is
    vendored at src/vendor/three.module.js and imported by relative path.
  -->
  <script type="module">
    import {
      SatelliteView,
      DisclaimerModal, TripPlanner, ItineraryView, TripProgress,
      loadFloorData, buildRouteNodes, buildPathIndex, planTrip, planToLegs,
    } from './3D_satellite/src/index.js';
    import qrcodegen from './3D_satellite/src/vendor/qrcodegen.js';

    // Root ("/", no ?building=) shows a building picker instead of the map;
    // picking one (or loading a link with ?building= already set) navigates
    // to ?building=<id> and shows the usual map/floor-switch UI for it.
    // buildings.json - a copy of the Editor's own App_Data file, kept in
    // sync by hand whenever a building/floor is added or renamed there - is
    // the one source of truth for building names AND each building's floor
    // names/ids; which of those floors actually get a button here is still
    // decided by probing floors/<buildingId>/<floorId>/boundary.json for
    // existence, since a building can list a floor whose data was never
    // copied/exported into this static site's own data folder.
    const BUILDINGS_JSON_URL = './3D_satellite/example/data/buildings.json';
    const FLOORS_BASE = './3D_satellite/example/data/floors';

    const params = new URLSearchParams(location.search);
    const buildingId = params.get('building');

    const pickerWrap = document.getElementById('picker-wrap');
    const pickerList = document.getElementById('picker-list');

    function goToBuilding(id) {
      const url = new URL(location.href);
      url.searchParams.set('building', id);
      location.href = url.toString();
    }

    async function loadBuildingsManifest() {
      const res = await fetch(BUILDINGS_JSON_URL);
      if (!res.ok) throw new Error(`Failed to fetch ${BUILDINGS_JSON_URL}: ${res.status} ${res.statusText}`);
      const doc = await res.json();
      return doc.Buildings || doc.buildings || [];
    }

    async function floorExists(buildingId, floorId) {
      try {
        const res = await fetch(`${FLOORS_BASE}/${buildingId}/${floorId}/boundary.json`, { method: 'HEAD' });
        return res.ok;
      } catch {
        return false;
      }
    }

    async function showBuildingPicker() {
      pickerWrap.hidden = false;
      let buildings;
      try {
        buildings = await loadBuildingsManifest();
      } catch (err) {
        console.error(err);
        pickerList.innerHTML = `<p class="picker-error">Couldn't load the building list: ${err.message}</p>`;
        return;
      }
      if (!buildings.length) {
        pickerList.innerHTML = '<p class="picker-empty">No buildings yet.</p>';
        return;
      }
      pickerList.innerHTML = '';
      for (const b of buildings) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = b.Name || b.name || `Building ${b.Id ?? b.id}`;
        btn.addEventListener('click', () => goToBuilding(b.Id ?? b.id));
        pickerList.appendChild(btn);
      }
    }

    // Resolves the current building's floor list: buildings.json gives the
    // candidate {id,name} pairs (in Floors[], FloorNumber order), and each is
    // kept only if its data actually exists in this static site's own data
    // folder - a building can list a floor the Editor created but whose
    // boundary/objects/graph/paths JSON was never copied/exported here.
    async function resolveFloors(buildingId) {
      let buildings;
      try {
        buildings = await loadBuildingsManifest();
      } catch (err) {
        console.error(err);
        return [];
      }
      const building = buildings.find((b) => String(b.Id ?? b.id) === String(buildingId));
      if (!building) return [];
      const candidates = [...(building.Floors || building.floors || [])]
        .sort((a, b) => (a.FloorNumber ?? a.floorNumber ?? 0) - (b.FloorNumber ?? b.floorNumber ?? 0));
      const checks = await Promise.all(candidates.map((f) => floorExists(buildingId, f.Id ?? f.id)));
      return candidates
        .filter((_, i) => checks[i])
        .map((f) => ({ name: f.Name || f.name || `Floor ${f.Id ?? f.id}`, url: `${FLOORS_BASE}/${buildingId}/${f.Id ?? f.id}/` }));
    }

    // Loads every floor's full data (not just the one currently on screen) so
    // the trip planner can list destinations building-wide and routePlanner.js
    // can look up a transporter's path on either side of a floor change.
    // Mirrors what SatelliteView.loadFloor does per-floor, just all at once
    // and without touching the 3D scene.
    async function loadAllFloors(floors) {
      return Promise.all(floors.map(async (floor) => {
        const data = await loadFloorData(floor.url);
        // Not deduped by name: the trip planner lists a name once, but needs every same-named node to pick the nearest.
        const nodes = buildRouteNodes(data).filter((n) => n.reachable);
        const pathIndex = buildPathIndex(data.paths);
        return { url: floor.url, name: floor.name, nodes, pathIndex };
      }));
    }

    // Same breakpoint as TripPlanner.js / ItineraryView.js's own CSS: at or
    // above this width they dock as a left sidebar instead of taking over
    // the whole screen, and the map stays loaded and visible behind/beside
    // them rather than being hidden while planning.
    const wideQuery = window.matchMedia('(min-width: 561px)');
    const SIDEBAR_WIDTH = 400;

    async function initMap(buildingId) {
      // Everything talks through DOM events on this one element.
      const mapEl = document.getElementById('map');
      const tripProgressRoot = document.getElementById('trip-progress-root');
      // Keep the floating UI out of the way when framing the building / a route.
      // Two stacked pills (TripProgress.js) sit bottom-center; the map
      // controls are back at bottom-right (styles.js's own default). On wide
      // screens the sidebar also reserves its own width on the left.
      const getInsets = () => ({
        bottom: 168, right: 70,
        left: wideQuery.matches ? SIDEBAR_WIDTH + 16 : 16,
      });
      // QR code of this page's URL (building and all). If you're browsing via localhost, a phone can't
      // reach it — set PHONE_URL to an address it can (LAN IP or deployed URL), e.g. 'http://192.168.1.20:8000/'.
      // When hosted online, leave it null: the QR then encodes the site's own address.
      const PHONE_URL = null;
      const qr = qrcodegen.QrCode.encodeText(PHONE_URL || location.href, qrcodegen.QrCode.Ecc.MEDIUM);
      const border = 2; // quiet zone, in modules
      let d = '';
      for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.getModule(x, y)) d += `M${x + border},${y + border}h1v1h-1z`;
      const dim = qr.size + border * 2;
      document.getElementById('qr').innerHTML =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges" role="img" aria-label="QR code to open this page on a phone"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

      const view = new SatelliteView(mapEl, { eventTarget: mapEl, getInsets });
      window.addEventListener('resize', () => view.refreshInsets());
      window.view = view; // handy for poking around in the console

      const FLOORS = await resolveFloors(buildingId);
      if (!FLOORS.length) {
        mapEl.insertAdjacentHTML('beforeend', '<p style="position:absolute;color:#fff;padding:20px">This building has no floor data yet.</p>');
        return;
      }

      let loadToken = 0;
      async function showFloor(floor) {
        const token = ++loadToken; // a slow earlier load must not overwrite a newer pick
        try {
          await view.loadFloor(floor.url);
          if (token !== loadToken) return;
          view.refreshInsets();
        } catch (err) {
          console.error(err);
          mapEl.insertAdjacentHTML('beforeend', `<p style="position:absolute;color:#fff;padding:20px">Failed to load floor data: ${err.message}</p>`);
        }
      }

      // On a wide screen the map is always visible beside the sidebar (see
      // TripPlanner.js / ItineraryView.js's own min-width: 561px rule) — only
      // a narrow screen's full-screen planner/itinerary needs to hide it.
      const chromeEls = [mapEl, document.getElementById('qr-card')];
      let mapWantsVisible = false; // the LAST intent, independent of which breakpoint applied it
      function setMapVisible(visible) {
        mapWantsVisible = visible;
        if (visible || !wideQuery.matches) {
          chromeEls.forEach((el) => { if (el) el.style.visibility = visible ? '' : 'hidden'; });
        }
      }
      // Crossing the breakpoint while a full-screen planner/itinerary (narrow)
      // or the sidebar (wide) is already open must re-apply that same intent
      // under the new layout — otherwise going narrow->wide mid-session could
      // leave the map hidden with nothing full-screen left covering it.
      wideQuery.addEventListener('change', () => {
        setMapVisible(mapWantsVisible);
        view.refreshInsets();
      });
      setMapVisible(false);

      const allFloors = await loadAllFloors(FLOORS);
      const defaultFloorIndex = 0;
      const defaultStartId = allFloors[defaultFloorIndex].nodes.find((n) => /kiosk/i.test(n.class))?.id
        || allFloors[defaultFloorIndex].nodes[0]?.id || null;
      const defaultStartNode = defaultStartId
        ? { floor: allFloors[defaultFloorIndex], node: allFloors[defaultFloorIndex].nodes.find((n) => n.id === defaultStartId) }
        : null;

      // Wide screens show the map immediately (it sits beside the sidebar,
      // never behind a full-screen takeover) — narrow screens still wait
      // until a trip actually starts (see tripPlanner.onPlan below).
      let loadedFloor = null;
      if (wideQuery.matches) {
        await showFloor(allFloors[defaultFloorIndex]);
        loadedFloor = allFloors[defaultFloorIndex];
        if (defaultStartNode) view.setUserNode(defaultStartNode.node.id);
        setMapVisible(true);
      }

      const disclaimer = new DisclaimerModal(document.getElementById('disclaimer-root'));
      const tripPlanner = new TripPlanner(document.getElementById('trip-planner-root'), {
        floors: allFloors,
        defaultStartNode,
        appName: 'Masar',
        logoUrl: './assets/logo.png',
      });
      const itinerary = new ItineraryView(document.getElementById('itinerary-root'));
      const progress = new TripProgress(tripProgressRoot);

      // ---- trip runner: walks `legs` one at a time, driving the map's own
      // single-floor route machinery (view.setRoute / view.seek) per leg,
      // switching floors between legs, and asking for arrival confirmation
      // at each leg's end (see TripProgress's onSeek/onArrive/onBack
      // callbacks below). This is the only place that advances a trip.
      // `loadedFloor` (declared above, with the wide-screen immediate load)
      // tracks whichever floor's data view.loadFloor() last resolved —
      // avoids reloading the same floor between two legs that share it. ----
      let legs = null;
      let lastItineraryArgs = null; // re-shown by Cancel (TripProgress) without re-planning

      async function enterLeg(index) {
        const leg = legs[index];
        if (leg.floor !== loadedFloor) {
          await showFloor(leg.floor);
          loadedFloor = leg.floor;
        }
        view.setRoute(leg.fromNode.id, leg.toNode.id); // also places the "you are here" dot at the leg's start
        progress.setLeg(index);
      }

      progress.onSeek = (p) => view.seek(p);
      progress.onBack = () => {
        if (progress.legIndex === 0) return;
        enterLeg(progress.legIndex - 1);
      };
      progress.onCancel = () => {
        progress.hide();
        view.clearRoute();
        setMapVisible(false);
        itinerary.show(lastItineraryArgs);
      };
      progress.onArrive = (leg, index) => {
        if (index < legs.length - 1) {
          enterLeg(index + 1);
        } else {
          // Final destination confirmed — back to planning, starting from here.
          progress.hide();
          view.clearRoute();
          setMapVisible(false);
          tripPlanner.reset({ start: { floor: leg.floor, node: leg.toNode } });
          tripPlanner.show();
        }
      };

      tripPlanner.onPlan = ({ startFloor, startNode, destFloor, destNode, preferStairs }) => {
        const plan = planTrip(startFloor, startNode, destFloor, destNode, { preferStairs });
        if (plan?.destNode) destNode = plan.destNode; // a picked "Exit" becomes the nearest exit
        tripPlanner.hide();
        lastItineraryArgs = { plan, startFloor, startNode, destFloor, destNode };
        itinerary.show(lastItineraryArgs);
        itinerary.startBtn.onclick = async () => {
          itinerary.hide();
          legs = planToLegs(plan, { startNode, destNode, startFloor, destFloor });
          if (!legs || !legs.length) { // same node picked twice, or no plan — just reveal the map as-is
            setMapVisible(true);
            if (startFloor !== loadedFloor) {
              await showFloor(startFloor);
              loadedFloor = startFloor;
            }
            if (startNode) view.setUserNode(startNode.id);
            return;
          }
          setMapVisible(true);
          progress.setLegs(legs);
          progress.show();
          await enterLeg(0);
        };
        itinerary.cancelBtn.onclick = () => {
          itinerary.hide();
          tripPlanner.reset({ start: { floor: startFloor, node: startNode } }); // keep the start, empty the destination
          tripPlanner.show();
        };
      };

      disclaimer.onDismiss = () => tripPlanner.show();
      disclaimer.show(); // shown every visit, deliberately not gated on a prior dismissal
    }

    if (!buildingId) {
      showBuildingPicker();
      // Nothing else on this page is set up yet - the map/panel UI stays
      // hidden (picker-wrap sits on top, z-index 10) until a picker click
      // reloads the page with ?building= set.
    } else {
      initMap(buildingId);
    }
  </script>
</body>
</html>
