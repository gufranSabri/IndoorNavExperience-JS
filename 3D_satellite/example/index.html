<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>Indoor Wayfinding — Satellite</title>
  <style>
    :root {
      --sat-font: Inter, ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --sat-glass: rgba(21, 23, 28, 0.8);
      --sat-border: rgba(255, 255, 255, 0.09);
      --sat-text: #eef1f5;
      --sat-muted: #98a2b3;
    }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100dvh;
      background: #0b0c0f;
      font-family: var(--sat-font);
      overscroll-behavior: none;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; }

    .panel {
      position: absolute; z-index: 5;
      top: calc(16px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left));
      width: min(380px, calc(100vw - 32px)); padding: 16px 16px 16px;
      border-radius: 20px; color: var(--sat-text);
      background: var(--sat-glass); border: 1px solid var(--sat-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    .brand { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 14px; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    .brand span { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sat-muted); }

    .player-wrap {
      position: absolute; z-index: 5; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none;
      bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .player-wrap > * { pointer-events: auto; }

    .hint {
      position: absolute; z-index: 4; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--sat-muted); white-space: nowrap;
      background: var(--sat-glass); border: 1px solid var(--sat-border); pointer-events: none;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: opacity 0.6s ease 0.4s;
    }
    .hint.is-hidden { opacity: 0; }
    @media (max-width: 560px), (pointer: coarse) { .hint { display: none; } }
    @media (max-width: 560px) {
      /* On a phone the selector is a full-width bar across the top of the screen. */
      .panel {
        top: 0; left: 0; right: 0; width: auto; box-sizing: border-box;
        padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));
        border-width: 0 0 1px 0; border-radius: 0 0 20px 20px;
      }
      .player-wrap { bottom: calc(14px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <div class="brand"><h1>Floor 5</h1><span>Indoor map</span></div>
    <div id="selector"></div>
  </div>

  <div class="player-wrap"><div id="player"></div></div>
  <div class="hint" id="hint">Drag to pan · scroll to zoom · right-drag to rotate &amp; tilt · zoom in for labels</div>

  <!--
    Plain native ES modules from src/ — no bundler, no npm, no CDN. Three.js is
    vendored at src/vendor/three.module.js and imported by relative path.
  -->
  <script type="module">
    import { SatelliteView, RouteSelector, RouteControls } from '../src/index.js';

    // Everything talks through DOM events on this one element.
    const mapEl = document.getElementById('map');
    const panel = document.querySelector('.panel');
    const player = document.getElementById('player');
    // Keep the floating UI out of the way when framing the building / a route.
    const getInsets = () => {
      const p = panel.getBoundingClientRect();
      const playerH = player.firstElementChild?.classList.contains('is-visible') ? 96 : 0;
      if (mapEl.clientWidth > 900) return { left: p.right + 8, right: 70, bottom: playerH };
      return { top: p.bottom + 4, bottom: Math.max(playerH, 12), right: 60 };
    };
    const view = new SatelliteView(mapEl, { eventTarget: mapEl, getInsets });

    // "exits-0" is the main entrance — where the blue "you are here" dot starts,
    // and the pre-selected start of any route.
    const ENTRANCE = 'exits-0';
    new RouteSelector(document.getElementById('selector'), { eventTarget: mapEl, defaultStartId: ENTRANCE });
    new RouteControls(document.getElementById('player'), { eventTarget: mapEl });
    // The card grows/shrinks when a route is set or cleared; keep the map framed around it.
    mapEl.addEventListener('wayfinding:route-cleared', () => view.refreshInsets());
    window.addEventListener('resize', () => view.refreshInsets());

    view.loadFloor('./data/floor5/').then(() => view.setUserNode(ENTRANCE)).catch((err) => {
      console.error(err);
      mapEl.insertAdjacentHTML('beforeend', `<p style="position:absolute;color:#fff;padding:20px">Failed to load floor data: ${err.message}</p>`);
    });

    const hint = document.getElementById('hint');
    const hideHint = () => hint.classList.add('is-hidden');
    mapEl.addEventListener('pointerdown', hideHint, { once: true });
    mapEl.addEventListener('wheel', hideHint, { once: true, passive: true });

    window.view = view; // handy for poking around in the console
  </script>
</body>
</html>
